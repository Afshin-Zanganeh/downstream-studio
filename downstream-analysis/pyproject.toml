[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interface-downstream-analysis"
version = "0.1.0"
description = "Data-agnostic downstream probes for biological interface embeddings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
]

[project.optional-dependencies]
csv = ["pandas>=2.0"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=7.0", "pandas>=2.0"]

[project.scripts]
interface-probes = "interface_downstream.cli:main"
interface-export-postgres = "interface_downstream.export_postgres:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

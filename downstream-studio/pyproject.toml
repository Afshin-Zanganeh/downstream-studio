[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "downstream-studio"
version = "0.1.0"
description = "Project-based web studio for downstream embedding experiments"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["paramiko>=3.4,<5", "keyring>=25,<27"]

[project.scripts]
downstream-studio = "downstream_studio.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
downstream_studio = ["web/*", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
